<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vídeo demonstração</title>
    <style>
      /* Mesmas fontes do site, servidas direto do repositório (ver
         scripts/render.mjs, que sobe um servidor estático na raiz). */
      @font-face {
        font-family: "Whyte Inktrap";
        src: url("/src/fonts/whyte-inktrap/WhyteInktrap-Black.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "Switzer";
        src: url("/src/fonts/switzer/Switzer-Italic.woff2") format("woff2");
        font-style: italic;
      }
      @font-face {
        font-family: "Plex Mono";
        src: url("/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Plex Mono";
        src: url("/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Archivo";
        src: url("/node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
