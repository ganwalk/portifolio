name: Capturar capas dos projetos de artista

# Só sob demanda: os três sites (Ganwalk, Dezert Horse, Pink Opala) não
# mudam com frequência, então não faz sentido gastar minutos de CI num
# agendamento recorrente. Dispare manualmente (aba Actions) sempre que um
# dos sites publicados mudar visualmente e a capa merecer atualização.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright e sharp (ferramenta de bancada, fora do package.json)
        run: npm install --no-save playwright sharp

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Capturar e converter
        run: node scripts/capture-artist-covers.mjs

      # Abre PR em vez de empurrar direto pra main: vídeo capturado de um
      # site com animação pode pegar um quadro estranho ou uma transição no
      # meio, vale revisar antes de virar a capa de verdade do case.
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Atualiza capas dos projetos de artista com captura real dos sites"
          title: "Capas reais: Ganwalk, Dezert Horse e Pink Opala"
          body: |
            Captura automática (ver `scripts/capture-artist-covers.mjs`) da tela de
            repouso dos três sites publicados, alguns segundos depois de carregar.

            Antes de mergear:
            - Revise os vídeos e stills em `public/videos/*-live.mp4` e
              `public/photos/*-live-poster.webp`.
            - Se estiverem bons, aponte o campo `cover` de cada case em
              `src/data/cases.ts` pra eles (troca manual, de propósito: cada capa
              atual já foi escolhida a dedo pelo clima do case).
          branch: capture/artist-covers
          add-paths: |
            public/videos/*-live.mp4
            public/photos/*-live-poster.webp
